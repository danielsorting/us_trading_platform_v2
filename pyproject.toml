[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-trading-platform"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "yfinance>=0.2.54", "requests>=2.31", "streamlit>=1.38"]

[tool.setuptools.packages.find]
where = ["src"]
