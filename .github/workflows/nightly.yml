name: Nattrapport med riktiga kurser

on:
  schedule:
    # Vardagar 22:37 UTC (23:37 svensk vintertid) – efter att USA-börsen stängt.
    - cron: "37 22 * * 1-5"
  workflow_dispatch: {}   # gör att rapporten också kan startas manuellt

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera paket
        run: pip install pandas numpy yfinance requests pytest
      - name: Kör testerna
        run: python -m pytest -q
      - name: Skapa nattrapport
        run: python scripts/nightly_report.py
      - name: Spara rapporten i projektet
        if: always()
        run: |
          git config user.name "nattrapport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Nattrapport $(date -u +%Y-%m-%d)" || echo "Inget nytt att spara"
          git pull --rebase origin main && git push origin HEAD:main
