name: Testa allt (webbsidan och roboten)

# Körs vid varje ändring och kan startas manuellt. Klickar igenom hela webbsidan
# med påhittade kurser och kör alla vanliga tester.
on:
  push:
    branches: [main]
    paths-ignore: ["paper/**", "reports/**"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Vanliga tester
        run: python -m pytest -q --ignore=tests/test_app_ui.py
      - name: Klicka igenom hela webbsidan
        env:
          TP_FAKE_DATA: "1"
        run: python -m pytest -q -x tests/test_app_ui.py --durations=10
