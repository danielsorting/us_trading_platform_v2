name: Automatisk handel (låtsaspengar)

on:
  schedule:
    # Var 15:e minut vardagar 13:00–21:59 UTC. Täcker USA-börsens öppettider både
    # sommar- och vintertid; skriptet avslutar direkt om börsen är stängd.
    - cron: "4,19,34,49 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-trade
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - name: Installera paket
        run: pip install -r requirements-bot.txt
      - name: Handla
        run: python scripts/auto_trade.py
      - name: Spara konto och logg
        if: always()
        run: |
          git config user.name "autohandel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/ || true
          git commit -m "Automatisk handel $(date -u +%H:%M) UTC" || { echo "Inget nytt att spara"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
