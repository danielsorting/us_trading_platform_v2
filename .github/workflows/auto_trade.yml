name: Automatisk handel (låtsaspengar)

# Roboten kör en handelsrunda var 5:e minut från Avanzas förhandel till efterhandelns
# slut, i några få långa körningar (GitHub hoppar annars ofta över schemalagda körningar).
on:
  schedule:
    # Roboten kör en runda var 5:e minut under börsdagen 15:30–22:00 svensk tid.
    # En körning får vara max ca 6 timmar, så nästa (köad) körning tar vid. Tider i UTC.
    # (Handel i Avanzas för-/efterhandel finns förberedd men är avstängd: extended_hours_swing.)
    - cron: "20 13 * * 1-5"   # 14:20 svensk tid – startar före öppning
    - cron: "20 14 * * 1-5"   # reserv
    - cron: "20 17 * * 1-5"   # tar vid efter första körningen
    - cron: "20 19 * * 1-5"   # reserv fram till stängning
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-trade
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # hemligt kanalnamn för mobilnotiser (ntfy-appen)

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - name: Installera paket
        run: pip install -r requirements-bot.txt
      - name: Handla var 5:e minut under börsdagen
        run: |
          git config user.name "autohandel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LIMIT=$((340 * 60))   # sluta efter ca 5 h 40 min så nästa körning kan ta vid
          sync() {   # hämta senaste versionen (kod + konto) innan varje runda
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
          }
          while [ $SECONDS -lt $LIMIT ]; do
            sync || echo "Kunde inte hämta senaste versionen – kör med den vi har."
            PHASE=$(python scripts/market_phase.py)
            # För- och efterhandel bara om det är påslaget i config.json (extended_hours_swing).
            if [ "$PHASE" = "pre" ] || [ "$PHASE" = "post" ]; then
              if ! grep -q '"extended_hours_swing": true' config.json; then
                [ "$PHASE" = "post" ] && PHASE="after" || PHASE="before"
              fi
            fi
            if [ "$PHASE" = "weekend" ]; then echo "Helg – inget att göra."; break; fi
            if [ "$PHASE" = "after" ]; then
              python scripts/auto_trade.py || true   # stänger ev. kvarvarande dagpositioner
              SAVE=1
            elif [ "$PHASE" = "open" ] || [ "$PHASE" = "pre" ] || [ "$PHASE" = "post" ]; then
              python scripts/auto_trade.py || echo "Rundan misslyckades – försöker igen om 5 minuter."
              SAVE=1
            else
              echo "$(date -u +%H:%M) UTC – väntar på att börsen öppnar."
              SAVE=0
            fi
            if [ "$SAVE" = "1" ]; then
              git add paper/ || true
              if git commit -q -m "Automatisk handel $(date -u +%H:%M) UTC"; then
                for i in 1 2 3; do
                  # Robotens filer (paper/) vinner vid krock; misslyckas det avbryts sammanslagningen rent.
                  if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then break; fi
                  git rebase --abort 2>/dev/null || true
                  sleep 5
                done
              fi
            fi
            if [ "$PHASE" = "after" ]; then echo "Börsen har stängt – klart för i dag."; break; fi
            sleep $(( 300 - $(date +%s) % 300 + 20 ))   # nästa jämna 5-minuterstid (+20 s)
          done
